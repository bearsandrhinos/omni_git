# Reference this view as ecomm__relationships_test__order_items
# View is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
description: The table contains records of individual line items within customer
  orders. Each record captures details about the item's fulfillment lifecycle,
  including shipping, delivery, and return status, as well as financial details
  such as sale price and margin.

schema: ECOMM
folder: ECOMM/relationships_test
table_name: ORDER_ITEMS

dimensions:
  id:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"ID"'
    format: ID
    description: Unique identifier for each order item record.

  order_id:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"ORDER_ID"'
    format: ID
    description: The unique identifier associated with an order.

  user_id:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"USER_ID"'
    format: ID
    description: The unique identifier assigned to a user who placed an order.

  inventory_item_id:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"INVENTORY_ITEM_ID"'
    format: ID
    description: The unique identifier for an inventory item associated with an order line.
    primary_key: true

  sale_price:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"SALE_PRICE"'
    description: The sale price of an individual order item.

  status:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"STATUS"'
    description: The current fulfillment status of an order item.

  created_at:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"CREATED_AT"'
    description: The timestamp indicating when the order item record was created.

  returned_at:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"RETURNED_AT"'
    description: The date and time at which an order item was returned.

  shipped_at:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"SHIPPED_AT"'
    description: The date and time at which an order item was shipped.

  delivered_at:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"DELIVERED_AT"'
    description: The date and time at which the order item was delivered.

  is_returned:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"IS_RETURNED"'
    description: Indicates whether an order item has been returned.

  is_delivered:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"IS_DELIVERED"'
    description: Indicates whether an order item has been delivered.

  is_shipped:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"IS_SHIPPED"'
    description: Indicates whether an order item has been shipped.

  margin:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"MARGIN"'
    description: The profit margin associated with each order item.

  months_since_signup:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"MONTHS_SINCE_SIGNUP"'
    description: The number of months elapsed since the customer signed up.

  time_to_ship:
    # Dimension is defined in the semantic view RELATIONSHIPS_TEST in the data warehouse
    sql: '"TIME_TO_SHIP"'
    description: The number of days taken to ship an order item from the time the
      order was placed.

measures:
  count:
    aggregate_type: count
