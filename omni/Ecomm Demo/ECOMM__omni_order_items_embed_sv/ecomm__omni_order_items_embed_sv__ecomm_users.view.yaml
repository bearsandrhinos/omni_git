    sql: '"FIRST_NAME"'

  last_name:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"LAST_NAME"'

  email:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"EMAIL"'

  age:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"AGE"'

  city:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"CITY"'

  state:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"STATE"'

  country:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"COUNTRY"'

  zip:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"ZIP"'

  latitude:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"LATITUDE"'

  longitude:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
