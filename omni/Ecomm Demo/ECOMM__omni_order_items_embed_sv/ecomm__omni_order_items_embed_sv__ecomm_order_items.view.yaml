# Reference this view as ecomm__omni_order_items_embed_sv__ecomm_order_items
# View is defined in the semantic view omni_order_items_embed_sv in the data warehouse
schema: ECOMM
folder: ECOMM/omni_order_items_embed_sv
table_name: ORDER_ITEMS

dimensions:
  id:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"ID"'
    format: ID
    primary_key: true

  order_id:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"ORDER_ID"'
    format: ID

  user_id:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"ID"'
    format: ID

  inventory_item_id:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"INVENTORY_ITEM_ID"'
    format: ID

  sale_price:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"SALE_PRICE"'

  status:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"STATUS"'

  created_at:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"CREATED_AT"'

  returned_at:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"RETURNED_AT"'

  shipped_at:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"SHIPPED_AT"'

  delivered_at:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"DELIVERED_AT"'

  is_returned:
    sql: '"IS_RETURNED"'

  is_delivered:
    sql: '"IS_DELIVERED"'

  is_shipped:
    sql: '"IS_SHIPPED"'

  margin:
    sql: '"MARGIN"'

  months_since_signup:
    sql: '"MONTHS_SINCE_SIGNUP"'

  time_to_ship:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: DATEDIFF('days', "CREATED_AT", "SHIPPED_AT")
    description: Time between order created and order shipped

  status_ordering:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: CASE WHEN "STATUS" = 'Complete' THEN 1 WHEN "STATUS" = 'Shipped' THEN 2
      WHEN "STATUS" = 'Processing' THEN 3 WHEN "STATUS" = 'Cancelled' THEN 4
      WHEN "STATUS" = 'Returned' THEN 5 ELSE 6 END
    description: This actually will order the fields, trust me

measures:
  count:
    # Measure is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: COUNT(DISTINCT "ID")

  created_at_min:
    # Measure is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: MIN("CREATED_AT")

  time_to_ship_average:
    # Measure is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: AVG("TIME_TO_SHIP")

  total_revenue:
    # Measure is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: SUM(CASE WHEN "STATUS" = 'Complete' THEN "SALE_PRICE" ELSE NULL END)
    description: this is complted orders

  total_sale_price:
    # Measure is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: SUM("SALE_PRICE" * 0.95)
    description: this is all about revenue
